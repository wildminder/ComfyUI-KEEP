[project]
name = "ComfyUI-KEEP"
description = "Kalman-Inspired Feature Propagation for Video Face Super-Resolution"
version = "2.0.0"
license = {file = "LICENSE"}
requires-python = ">=3.10"
# The true runtime set of the pack (P2.6) - it is derived from the pruned
# runtime closure of the vendored tree and matches requirements.txt.
dependencies = ["torch", "torchvision", "numpy", "opencv-python", "Pillow", "einops", "scipy", "tqdm", "pyyaml", "requests"]

# The test-only dependencies.  ``tomli`` is the ``tomllib`` parser of
# Python 3.10 (the minimum of ``requires-python``) - the metadata test
# imports it when the standard library has no ``tomllib`` yet.
[project.optional-dependencies]
test = ["tomli>=2.0; python_version < '3.11'"]

[project.urls]
Repository = "https://github.com/wildminder/ComfyUI-KEEP"
#  Used by Comfy Registry https://comfyregistry.org

[tool.comfy]
PublisherId = "wildai"
DisplayName = "KEEP"
# The preview asset of the registry entry.  The file is committed in the
# repository (``assets/keep-preview.png``); P6.5 may replace the image, but
# the key must keep pointing at a file that exists.
Icon = "assets/keep-preview.png"
requires-comfyui = ">=0.28.0"

# P1.1 - pytest harness configuration.
# The four markers are the tiers of the modernization plan (section 4):
#   unit             - pure logic, no ComfyUI dependency
#   mock_integration - node execute paths against the root conftest mocks
#   headless         - real ComfyUI source tree on sys.path, no server
#   gpu_acceptance   - opt-in real-weight run (RUN_KEEP_E2E + KEEP_MODEL_DIR)
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --import-mode=importlib"
consider_namespace_packages = true
pythonpath = ["."]
markers = [
    "unit: Pure unit test (no ComfyUI dependency)",
    "mock_integration: Mock-based integration test (node execute paths against the conftest mocks)",
    "headless: Requires the real ComfyUI source tree on sys.path (no server)",
    "gpu_acceptance: Opt-in real-weight run (RUN_KEEP_E2E=1 and KEEP_MODEL_DIR)",
]

# P1.5 - the lint gate of .github/workflows/tests.yml.
# Scope decision (same as the reference pack ComfyUI-DyPE): the gate covers the
# *correctness* rules (pyflakes F + syntax errors E9).  The vendored
# third-party tree (modules/deps) is excluded - it is upstream code, not ours.
[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["modules/deps"]

[tool.ruff.lint]
select = ["E9", "F"]
# F401 (unused import) and F541 (f-string without placeholders) are style
# findings in the *existing* production code; they are cleaned up in the
# production phases (P4.7), not in the test-infrastructure phase.
ignore = ["F401", "F541"]
